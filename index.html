<!DOCTYPE html>
<html>
<head>
  <title>Study Plan Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="manifest" href="/manifest.json">
   <meta name="theme-color" content="#4f46e5">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #f5f7fb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    .day {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .task {
      margin-left: 10px;
      color: #333;
    }

    .note {
      color: #888;
      font-size: 13px;
    }

    .phase {
      background: #eef2ff;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎯 Study Plan Generator</h1>

  <div class="card">
    <label>Study Duration</label>
    <select id="weeks">
      <option value="4">4 Weeks</option>
      <option value="8">8 Weeks</option>
      <option value="12">12 Weeks</option>
    </select>

    <label>Hours per Day</label>
    <select id="hours">
      <option value="1">1 hour</option>
      <option value="2">2 hours</option>
      <option value="3">3 hours</option>
    </select>

    <button onclick="generate()">Generate My Plan</button>
  </div>

  <div id="result"></div>

</div>

<script>
async function generate() {
  const weeks = document.getElementById('weeks').value
  const hours = document.getElementById('hours').value

  const res = await fetch('/generate', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ weeks, hours })
  })

  const data = await res.json()

  const container = document.getElementById('result')
  container.innerHTML = ''

  const totalDays = data.plan.length

  data.plan.slice(0, 7).forEach(day => {
    const div = document.createElement('div')
    div.className = 'card'

    const phase = getPhase(day.day, totalDays)

    div.innerHTML = `
      <div class="phase">${phase}</div>
      <div class="day"><strong>Day ${day.day}</strong></div>
      ${day.tasks.map(t => `
        <div class="task">
          - ${t.type}: ${t.content}
          <div class="note">${t.note || ''}</div>
        </div>
      `).join('')}
    `

    container.appendChild(div)
  })
}

function getPhase(day, total) {
  const ratio = day / total
  if (ratio < 0.3) return "📘 Foundation Phase"
  if (ratio < 0.8) return "🚀 Improvement Phase"
  return "🔥 Intensive Phase"
}
</script>

</body>
</html>
  })
}
</script>

</body>
</html>
