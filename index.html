<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyPlanner App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Header + 登录注册 -->
  <div class="header">
    <p class="logo-text">StudyPlanner</p>
    <div class="auth-buttons">
      <button id="login-btn">登录</button>
      <button id="register-btn">注册</button>
    </div>
  </div>

  <!-- Tab Pages -->
  <div class="tab-container">

    <!-- 成长中心 放到第一个 -->
    <div class="tab-page" id="tab-growth">
      <h2>成长中心</h2>
      <div id="growth-boards">
        <div class="board" data-board="trend">成长趋势看板</div>
        <div class="board" data-board="footprint">足迹档案</div>
        <div class="board" data-board="milestone">里程碑</div>
        <div class="board" data-board="next-goal">下一个目标</div>
      </div>
      <div id="growth-container">
        <p>今日完成 0 个任务</p>
      </div>
    </div>

    <!-- 今日计划 放到第二个 -->
    <div class="tab-page hidden" id="tab-today">
      <h2>今日计划</h2>
      <div id="task-list"></div>
    </div>

    <div class="tab-page hidden" id="tab-schedule">
      <h2>计划调度</h2>
      <p>每日任务拆解、阶段计划将在这里显示</p>
    </div>

    <div class="tab-page hidden" id="tab-profile">
      <h2>我的</h2>
      <p>用户名: <span id="user-name">未登录</span></p>
    </div>

  </div>

  <!-- 底部 Tab -->
  <div class="tab-bar">
    <button data-tab="tab-growth">成长中心</button>
    <button data-tab="tab-today">今日计划</button>
    <button data-tab="tab-schedule">计划调度</button>
    <button data-tab="tab-profile">我的</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
