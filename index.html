<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyPlanner</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- Header -->
    <div class="header">
      <div>
        <p class="logo-text">StudyPlanner</p>
        <h1>今天继续靠近 IELTS 7.5</h1>
      </div>

      <div class="plant">
        🌱
      </div>
    </div>

    <!-- Progress Card -->
    <div class="progress-card">
      <div class="progress-top">
        <div>
          <p class="small-text">当前阶段</p>
          <h2>Listening Foundation</h2>
        </div>

        <div class="right">
          <p class="small-text">目标</p>
          <h3>IELTS 7.5</h3>
        </div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>

      <div class="progress-bottom">
        <span>当前能力 5.0</span>
        <span>成长中</span>
      </div>
    </div>

    <!-- Tasks -->
    <div class="section-title">
      <h2>今日任务</h2>
      <span>45 min</span>
    </div>

    <div class="task-list">

      <div class="task-card">
        <div class="task-top">
          <div>
            <h3>听力：数字与日期识别训练</h3>
            <p>15 min</p>
          </div>

          <button class="task-btn">
            开始
          </button>
        </div>

        <div class="growth-box">
          <strong>能力成长：</strong>
          提升 Part1 基础信息捕捉能力
        </div>
      </div>

      <div class="task-card">
        <div class="task-top">
          <div>
            <h3>阅读：关键词定位练习</h3>
            <p>20 min</p>
          </div>

          <button class="task-btn">
            开始
          </button>
        </div>

        <div class="growth-box">
          <strong>能力成长：</strong>
          提升快速定位能力
        </div>
      </div>

      <div class="task-card completed">
        <div class="task-top">
          <div>
            <h3>词汇：高频词 10 个</h3>
            <p>10 min</p>
          </div>

          <button class="task-btn done">
            已完成
          </button>
        </div>

        <div class="growth-box">
          <strong>能力成长：</strong>
          强化阅读识别率
        </div>
      </div>

    </div>

    <!-- Weekly Growth -->
    <div class="growth-card">
      <p class="week-text">本周成长</p>

      <h2>
        你的阅读定位速度提升了 18%
      </h2>

      <div class="growth-detail">
        上周你平均需要 6 分钟完成定位练习，
        现在已经缩短到 4 分 55 秒。
      </div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
